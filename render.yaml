services:
  - type: web
    name: chantier-ai-php
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        value: mysql-db.render.internal
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: chantier_ai
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: mysql-db
          property: env.MYSQL_ROOT_PASSWORD
      - key: APP_URL
        value: https://chantier-ai-php.onrender.com
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        value: YOUR_GEMINI_API_KEY_HERE

  - type: pserv
    name: mysql-db
    env: docker
    image: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: chantier_ai
      - key: MYSQL_ROOT_HOST
        value: "%"
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: pserv
    name: phpmyadmin
    env: docker
    image: phpmyadmin:latest
    envVars:
      - key: PMA_HOST
        value: mysql-db.render.internal
      - key: PMA_USER
        value: root
      - key: PMA_PASSWORD
        fromService:
          type: pserv
          name: mysql-db
          property: env.MYSQL_ROOT_PASSWORD
    ports:
      - port: 80
        startPort: 8081

