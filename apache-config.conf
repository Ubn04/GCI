<VirtualHost *:3000>
    ServerAdmin admin@chantierai.local
    ServerName chantierai.local
    ServerAlias *.chantierai.local

    DocumentRoot /var/www/html

    # Configuration des répertoires
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Réécriture d'URL avec mod_rewrite
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php?q=$1 [L,QSA]
        </IfModule>
    </Directory>

    # Configuration des logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Activer la compression gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Cache headers pour les fichiers statiques
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>

    # Sécurité - Masquer la version d'Apache
    ServerTokens Prod
    ServerSignature Off

    # Empêcher l'accès aux fichiers sensibles
    <FilesMatch "^(\.htaccess|\.env|composer\.json|composer\.lock|database\.sql)">
        <IfModule mod_authz_core.c>
            Require all denied
        </IfModule>
        <IfModule !mod_authz_core.c>
            Order allow,deny
            Deny from all
        </IfModule>
    </FilesMatch>
</VirtualHost>

# Écouter sur le port 3000 (port par défaut de Render)
Listen 0.0.0.0:3000
