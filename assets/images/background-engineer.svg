<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2817;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1810;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond dégradé -->
  <rect width="1400" height="900" fill="url(#bgGradient)"/>
  
  <!-- Bâtiment/chantier à l'arrière plan -->
  <rect x="900" y="200" width="400" height="500" fill="#8B7355" opacity="0.3"/>
  <rect x="920" y="220" width="30" height="40" fill="#FFD700" opacity="0.4"/>
  <rect x="980" y="220" width="30" height="40" fill="#FFD700" opacity="0.4"/>
  <rect x="1040" y="220" width="30" height="40" fill="#FFD700" opacity="0.4"/>
  <rect x="1100" y="220" width="30" height="40" fill="#FFD700" opacity="0.4"/>
  <rect x="1160" y="220" width="30" height="40" fill="#FFD700" opacity="0.4"/>
  
  <!-- Grue de chantier -->
  <line x1="1200" y1="100" x2="1200" y2="200" stroke="#333" stroke-width="4"/>
  <line x1="1100" y1="120" x2="1300" y2="120" stroke="#FF6B6B" stroke-width="3"/>
  
  <!-- Table/Schéma de chantier -->
  <g transform="translate(200, 350)">
    <!-- Table en bois -->
    <rect x="0" y="250" width="400" height="20" fill="#8B6914"/>
    <rect x="20" y="270" width="15" height="80" fill="#6B5310"/>
    <rect x="365" y="270" width="15" height="80" fill="#6B5310"/>
    
    <!-- Surface de travail -->
    <rect x="0" y="0" width="400" height="250" fill="#F5DEB3" stroke="#8B6914" stroke-width="2"/>
    
    <!-- Plans/Documents -->
    <rect x="20" y="20" width="180" height="120" fill="#E8E8E8" stroke="#333" stroke-width="2"/>
    <line x1="30" y1="35" x2="190" y2="35" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="50" x2="190" y2="50" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="65" x2="190" y2="65" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="80" x2="190" y2="80" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="95" x2="190" y2="95" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="110" x2="190" y2="110" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="125" x2="190" y2="125" stroke="#333" stroke-width="1"/>
    
    <!-- Stylo/Crayon -->
    <line x1="220" y1="50" x2="280" y2="20" stroke="#FF8C00" stroke-width="8" stroke-linecap="round"/>
    <circle cx="280" cy="20" r="6" fill="#FFD700"/>
    
    <!-- Règle -->
    <rect x="200" y="160" width="200" height="12" fill="#C0C0C0" stroke="#666" stroke-width="1"/>
    <rect x="210" y="164" width="8" height="4" fill="#666"/>
    <rect x="230" y="164" width="8" height="4" fill="#666"/>
    <rect x="250" y="164" width="8" height="4" fill="#666"/>
    <rect x="270" y="164" width="8" height="4" fill="#666"/>
    <rect x="290" y="164" width="8" height="4" fill="#666"/>
    <rect x="310" y="164" width="8" height="4" fill="#666"/>
    <rect x="330" y="164" width="8" height="4" fill="#666"/>
  </g>
  
  <!-- Ingénieur/Technicien (homme noir) -->
  <g transform="translate(500, 250)">
    <!-- Tête -->
    <circle cx="0" cy="0" r="50" fill="url(#skinGradient)"/>
    
    <!-- Cheveux -->
    <path d="M -50 -20 Q -50 -60 0 -65 Q 50 -60 50 -20" fill="#1a0f0a"/>
    
    <!-- Yeux -->
    <circle cx="-18" cy="-8" r="6" fill="#FFF"/>
    <circle cx="18" cy="-8" r="6" fill="#FFF"/>
    <circle cx="-18" cy="-8" r="3" fill="#000"/>
    <circle cx="18" cy="-8" r="3" fill="#000"/>
    
    <!-- Nez -->
    <polygon points="0,-5 -8,5 8,5" fill="#2d1810"/>
    
    <!-- Bouche -->
    <path d="M -15 15 Q 0 25 15 15" stroke="#1a0f0a" stroke-width="2" fill="none"/>
    
    <!-- Cou -->
    <rect x="-25" y="45" width="50" height="30" fill="url(#skinGradient)"/>
    
    <!-- Corps - Vêtements professionnels (chemise blanche) -->
    <rect x="-80" y="75" width="160" height="100" fill="#FFFFFF" stroke="#CCC" stroke-width="2" rx="10"/>
    
    <!-- Cravate -->
    <polygon points="0,75 -15,120 15,120" fill="#1E3A8A"/>
    
    <!-- Manches -->
    <ellipse cx="-80" cy="100" rx="20" ry="35" fill="#FFFFFF" stroke="#CCC" stroke-width="2"/>
    <ellipse cx="80" cy="100" rx="20" ry="35" fill="#FFFFFF" stroke="#CCC" stroke-width="2"/>
    
    <!-- Bras gauche -->
    <g transform="translate(-100, 100) rotate(-30)">
      <rect x="0" y="0" width="25" height="120" rx="12" fill="url(#skinGradient)"/>
      <!-- Main -->
      <circle cx="12" cy="125" r="18" fill="url(#skinGradient)"/>
      <!-- Stylo dans la main -->
      <line x1="20" y1="125" x2="60" y2="110" stroke="#FF8C00" stroke-width="6"/>
    </g>
    
    <!-- Bras droit -->
    <g transform="translate(100, 100) rotate(15)">
      <rect x="-25" y="0" width="25" height="110" rx="12" fill="url(#skinGradient)"/>
      <!-- Main -->
      <circle cx="-12" cy="115" r="18" fill="url(#skinGradient)"/>
    </g>
    
    <!-- Pantalon -->
    <rect x="-60" y="175" width="50" height="120" fill="#2C3E50"/>
    <rect x="10" y="175" width="50" height="120" fill="#2C3E50"/>
    
    <!-- Chaussures -->
    <ellipse cx="-35" cy="300" rx="28" ry="18" fill="#1a1a1a"/>
    <ellipse cx="35" cy="300" rx="28" ry="18" fill="#1a1a1a"/>
  </g>
  
  <!-- Texte inspirant -->
  <text x="700" y="150" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.3">
    Rapports Professionnels
  </text>
</svg>
