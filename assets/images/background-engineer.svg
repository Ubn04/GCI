<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="craneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="300" cy="150" rx="80" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="320" cy="140" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="280" cy="140" rx="50" ry="20" fill="white" opacity="0.8"/>
  
  <ellipse cx="1200" cy="200" rx="100" ry="40" fill="white" opacity="0.7"/>
  <ellipse cx="1230" cy="190" rx="70" ry="30" fill="white" opacity="0.7"/>
  <ellipse cx="1170" cy="190" rx="60" ry="25" fill="white" opacity="0.7"/>
  
  <ellipse cx="1600" cy="120" rx="90" ry="35" fill="white" opacity="0.6"/>
  <ellipse cx="1630" cy="110" rx="65" ry="28" fill="white" opacity="0.6"/>
  
  <!-- Buildings in construction -->
  <rect x="100" y="400" width="200" height="400" fill="url(#buildingGradient)"/>
  <rect x="120" y="420" width="30" height="40" fill="#FFD700" opacity="0.8"/>
  <rect x="170" y="450" width="30" height="40" fill="#FFD700" opacity="0.8"/>
  <rect x="220" y="480" width="30" height="40" fill="#FFD700" opacity="0.8"/>
  
  <rect x="350" y="350" width="180" height="450" fill="url(#buildingGradient)"/>
  <rect x="370" y="370" width="25" height="35" fill="#FFD700" opacity="0.8"/>
  <rect x="410" y="400" width="25" height="35" fill="#FFD700" opacity="0.8"/>
  <rect x="450" y="430" width="25" height="35" fill="#FFD700" opacity="0.8"/>
  
  <rect x="580" y="450" width="160" height="350" fill="url(#buildingGradient)"/>
  <rect x="600" y="470" width="20" height="30" fill="#FFD700" opacity="0.8"/>
  <rect x="640" y="500" width="20" height="30" fill="#FFD700" opacity="0.8"/>
  
  <!-- Construction Crane -->
  <rect x="800" y="200" width="15" height="600" fill="url(#craneGradient)"/>
  <rect x="700" y="205" width="200" height="10" fill="url(#craneGradient)"/>
  <rect x="815" y="180" width="100" height="8" fill="url(#craneGradient)"/>
  
  <!-- Crane hook -->
  <line x1="880" y1="188" x2="880" y2="350" stroke="#333" stroke-width="2"/>
  <rect x="875" y="350" width="10" height="15" fill="#333"/>
  
  <!-- Construction materials -->
  <rect x="1000" y="750" width="80" height="50" fill="#8B4513"/>
  <rect x="1100" y="730" width="60" height="70" fill="#8B4513"/>
  <rect x="1180" y="740" width="70" height="60" fill="#8B4513"/>
  
  <!-- Concrete mixer -->
  <ellipse cx="1350" cy="750" rx="40" ry="25" fill="#C0C0C0"/>
  <rect x="1320" y="740" width="60" height="20" fill="#C0C0C0"/>
  <circle cx="1330" cy="770" r="15" fill="#333"/>
  <circle cx="1370" cy="770" r="15" fill="#333"/>
  
  <!-- Engineer figure -->
  <g transform="translate(1500, 600)">
    <!-- Body -->
    <rect x="0" y="40" width="30" height="60" fill="#4A90E2" rx="5"/>
    <!-- Head -->
    <circle cx="15" cy="20" r="15" fill="#FDBCB4"/>
    <!-- Hard hat -->
    <ellipse cx="15" cy="12" rx="18" ry="12" fill="#FFD700"/>
    <rect x="5" y="8" width="20" height="8" fill="#FFA500"/>
    <!-- Arms -->
    <rect x="-10" y="45" width="15" height="4" fill="#FDBCB4" rx="2"/>
    <rect x="25" y="45" width="15" height="4" fill="#FDBCB4" rx="2"/>
    <!-- Legs -->
    <rect x="5" y="100" width="8" height="30" fill="#2C3E50"/>
    <rect x="17" y="100" width="8" height="30" fill="#2C3E50"/>
    <!-- Clipboard -->
    <rect x="35" y="40" width="12" height="16" fill="white" stroke="#333" stroke-width="1"/>
    <line x1="37" y1="44" x2="45" y2="44" stroke="#333" stroke-width="0.5"/>
    <line x1="37" y1="47" x2="45" y2="47" stroke="#333" stroke-width="0.5"/>
    <line x1="37" y1="50" x2="45" y2="50" stroke="#333" stroke-width="0.5"/>
  </g>
  
  <!-- Construction vehicles -->
  <g transform="translate(200, 750)">
    <!-- Excavator -->
    <rect x="0" y="20" width="80" height="30" fill="#FFD700"/>
    <rect x="70" y="0" width="20" height="25" fill="#FFD700"/>
    <circle cx="15" cy="50" r="12" fill="#333"/>
    <circle cx="65" cy="50" r="12" fill="#333"/>
    <!-- Excavator arm -->
    <rect x="80" y="10" width="40" height="6" fill="#FFD700" transform="rotate(-20 80 13)"/>
    <rect x="115" y="5" width="30" height="6" fill="#FFD700" transform="rotate(-45 115 8)"/>
    <!-- Bucket -->
    <polygon points="140,0 150,0 155,10 135,10" fill="#C0C0C0"/>
  </g>
  
  <!-- Safety cones -->
  <polygon points="950,780 960,780 955,760" fill="#FF4500"/>
  <rect x="953" y="765" width="4" height="3" fill="white"/>
  
  <polygon points="1050,785 1060,785 1055,765" fill="#FF4500"/>
  <rect x="1053" y="770" width="4" height="3" fill="white"/>
  
  <!-- Construction barriers -->
  <rect x="400" y="780" width="200" height="8" fill="#FF4500"/>
  <rect x="410" y="775" width="20" height="18" fill="white"/>
  <rect x="440" y="775" width="20" height="18" fill="#FF4500"/>
  <rect x="470" y="775" width="20" height="18" fill="white"/>
  <rect x="500" y="775" width="20" height="18" fill="#FF4500"/>
  <rect x="530" y="775" width="20" height="18" fill="white"/>
  <rect x="560" y="775" width="20" height="18" fill="#FF4500"/>
  
  <!-- Ground/terrain -->
  <rect x="0" y="800" width="1920" height="280" fill="#8B7355"/>
  
  <!-- Construction site elements -->
  <rect x="1200" y="650" width="100" height="150" fill="#D2691E" opacity="0.8"/>
  <text x="1250" y="720" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">CHANTIER</text>
  <text x="1250" y="740" text-anchor="middle" fill="white" font-family="Arial" font-size="10">INTERDIT</text>
  <text x="1250" y="755" text-anchor="middle" fill="white" font-family="Arial" font-size="10">AU PUBLIC</text>
  
  <!-- Blueprint/plans -->
  <g transform="translate(1600, 650)">
    <rect x="0" y="0" width="60" height="40" fill="white" stroke="#4A90E2" stroke-width="2"/>
    <line x1="5" y1="8" x2="55" y2="8" stroke="#4A90E2" stroke-width="1"/>
    <line x1="5" y1="15" x2="35" y2="15" stroke="#4A90E2" stroke-width="1"/>
    <line x1="5" y1="22" x2="45" y2="22" stroke="#4A90E2" stroke-width="1"/>
    <line x1="5" y1="29" x2="25" y2="29" stroke="#4A90E2" stroke-width="1"/>
    <rect x="40" y="25" width="15" height="10" fill="none" stroke="#4A90E2" stroke-width="1"/>
  </g>
  
  <!-- Tools scattered -->
  <g transform="translate(800, 780)">
    <!-- Hammer -->
    <rect x="0" y="0" width="3" height="20" fill="#8B4513"/>
    <rect x="-2" y="0" width="7" height="6" fill="#C0C0C0"/>
  </g>
  
  <g transform="translate(850, 785)">
    <!-- Wrench -->
    <rect x="0" y="0" width="2" height="15" fill="#C0C0C0"/>
    <circle cx="1" cy="0" r="3" fill="#C0C0C0"/>
  </g>
  
  <!-- Progress indicators -->
  <rect x="100" y="350" width="200" height="10" fill="#E0E0E0"/>
  <rect x="100" y="350" width="120" height="10" fill="#4CAF50"/>
  
  <rect x="350" y="300" width="180" height="10" fill="#E0E0E0"/>
  <rect x="350" y="300" width="90" height="10" fill="#FF9800"/>
  
  <rect x="580" y="400" width="160" height="10" fill="#E0E0E0"/>
  <rect x="580" y="400" width="40" height="10" fill="#F44336"/>
</svg>